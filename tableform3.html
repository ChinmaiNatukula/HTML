
<!DOCTYPE html>
<html>
<head>
    <title>Nested Table</title>
</head>
<body>

<table border="2" cellpadding="15" cellspacing="3" width="500">

    <tr>
        <td align="center">Table 1</td>

        <td>
            <table border="2" cellpadding="10" cellspacing="3" width="100%">
                <tr>
                    <td align="center">Table 2</td>
                    <td align="center">Table 2</td>
                </tr>

                <tr>
                    <td align="center">Table 2</td>
                    <td align="center">Table 2</td>
                </tr>
            </table>
        </td>
    </tr>

    <tr>
        <td align="center">Table 1</td>

        <td align="center">
            <h1>&lt; / &gt;</h1>
        </td>
    </tr>

</table>

</body>
</html>
